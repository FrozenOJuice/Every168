name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and import boundaries
        run: mkdir -p ci-logs && pnpm lint 2>&1 | tee ci-logs/lint.log
      - name: Formatting
        run: pnpm format:check 2>&1 | tee ci-logs/format.log
      - name: Type checks
        run: pnpm typecheck 2>&1 | tee ci-logs/types.log
      - name: Unit and architecture tests
        run: pnpm test 2>&1 | tee ci-logs/unit-architecture.log
      - name: Production dependency audit
        run: pnpm audit --prod 2>&1 | tee ci-logs/audit.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-failure-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7

  integration-browser:
    name: Integration and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hours
          POSTGRES_PASSWORD: hours_test_only
          POSTGRES_DB: hours_test
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U hours -d hours_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Synthetic, job-local values. DATABASE_URL deliberately differs from the
      # _test URL: existing integration/browser safeguards reject identical URLs.
      DATABASE_URL: postgresql://hours:hours_local_only@127.0.0.1:54320/hours_dev
      TEST_DATABASE_URL: postgresql://hours:hours_test_only@127.0.0.1:54321/hours_test
      BETTER_AUTH_SECRET: synthetic-ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      WEB_ORIGIN: http://localhost:3100
      API_URL: http://127.0.0.1:3101
      RELEASE_SCOPE: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare local environment files
        run: mkdir -p ci-logs && pnpm setup:env 2>&1 | tee ci-logs/setup.log
      - name: Verify isolated test database readiness
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const url = process.env.TEST_DATABASE_URL;
          if (!new URL(url).pathname.endsWith("_test") || url === process.env.DATABASE_URL)
            throw new Error("CI requires an isolated _test database");
          const client = new pg.Client({ connectionString: url, connectionTimeoutMillis: 5000 });
          try {
            await client.connect();
            const { rows } = await client.query("select current_database() as name");
            if (rows[0].name !== "hours_test") throw new Error("Unexpected test database");
            console.log("Isolated PostgreSQL test database is ready.");
          } finally {
            await client.end();
          }
          NODE
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      # These suites migrate/use the same database and must remain sequential.
      - name: Integration tests
        run: pnpm test:integration 2>&1 | tee ci-logs/integration.log
      - name: Production build
        run: pnpm build 2>&1 | tee ci-logs/build.log
      - name: Beta browser suite
        run: pnpm test:e2e:beta 2>&1 | tee ci-logs/browser.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-browser-failure-${{ github.run_attempt }}
          path: |
            ci-logs/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
